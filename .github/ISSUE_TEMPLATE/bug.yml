name: Bug report
description: Something in Kiln is broken or behaves wrongly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what Kiln did instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kiln version
      description: Help > About Kiln, first line.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Graphics card
      description: Help > About Kiln lists it under "Graphics Card".
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: Attach SecondLife.log from the Kiln logs folder (Windows %APPDATA%\Kiln\logs, macOS ~/Library/Application Support/Kiln/logs, Linux ~/.kiln_x64/logs). Remove anything private first.
